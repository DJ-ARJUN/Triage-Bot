<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1000" viewBox="0 0 1400 1000" role="img" aria-labelledby="title desc">
  <title id="title">Triage-Bot safety-first workflow</title>
  <desc id="desc">Patient consent and symptom intake flow through privacy and information processing to a clinician reviewer, who makes all clinical decisions. Urgent warning signs are clearly escalated to human review.</desc>
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M1 1 L11 6 L1 11 Z" fill="#52627a"/></marker>
    <marker id="redArrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M1 1 L11 6 L1 11 Z" fill="#c2413b"/></marker>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#14233b" flood-opacity=".10"/></filter>
    <style>
      .title{font:700 38px Arial,sans-serif;fill:#15253d}.subtitle{font:400 18px Arial,sans-serif;fill:#52627a}
      .head{font:700 22px Arial,sans-serif;fill:#15253d}.body{font:400 17px Arial,sans-serif;fill:#34445b}.small{font:400 15px Arial,sans-serif;fill:#52627a}
      .card{filter:url(#shadow);stroke-width:2}.line{fill:none;stroke:#52627a;stroke-width:3;marker-end:url(#arrow)}
      .redline{fill:none;stroke:#c2413b;stroke-width:3;marker-end:url(#redArrow)}
    </style>
  </defs>
  <rect width="1400" height="1000" fill="#f5f8fc"/>
  <text x="700" y="68" text-anchor="middle" class="title">Triage-Bot: Safety-First Review Workflow</text>
  <text x="700" y="102" text-anchor="middle" class="subtitle">Information support for qualified clinical staff • Every output is advisory</text>

  <!-- Main workflow cards -->
  <g class="card">
    <rect x="65" y="190" width="285" height="270" rx="22" fill="#eaf3ff" stroke="#91b9ed"/>
    <circle cx="105" cy="235" r="22" fill="#2767ad"/><text x="105" y="243" text-anchor="middle" font="700 20px Arial" fill="white">1</text>
    <text x="140" y="243" class="head">Patient intake</text>
    <text x="95" y="291" class="body"><tspan x="95" dy="0">• Gives consent</tspan><tspan x="95" dy="31">• Shares symptoms by text</tspan><tspan x="112" dy="24">or voice</tspan><tspan x="95" dy="31">• Uploads reports or images</tspan><tspan x="95" dy="31">• English / Hindi support</tspan></text>
    <text x="95" y="430" class="small">Patient mobile app</text>
  </g>

  <g class="card">
    <rect x="405" y="190" width="330" height="270" rx="22" fill="#edf8f3" stroke="#84c6a6"/>
    <circle cx="445" cy="235" r="22" fill="#23845a"/><text x="445" y="243" text-anchor="middle" font="700 20px Arial" fill="white">2</text>
    <text x="480" y="243" class="head">Safe processing</text>
    <text x="435" y="291" class="body"><tspan x="435" dy="0">• Limits access by user role</tspan><tspan x="435" dy="31">• Masks identifying details</tspan><tspan x="435" dy="31">• Extracts report data; marks</tspan><tspan x="452" dy="24">uncertain readings for checking</tspan><tspan x="435" dy="31">• Organizes timeline and gaps</tspan></text>
    <text x="435" y="430" class="small">Consent • privacy • audit trail</text>
  </g>

  <g class="card">
    <rect x="790" y="190" width="265" height="270" rx="22" fill="#fff6e6" stroke="#e8bd67"/>
    <circle cx="830" cy="235" r="22" fill="#b87813"/><text x="830" y="243" text-anchor="middle" font="700 20px Arial" fill="white">3</text>
    <text x="865" y="243" class="head">Advisory summary</text>
    <text x="820" y="291" class="body"><tspan x="820" dy="0">• Shows reported facts</tspan><tspan x="820" dy="31">• Highlights urgency signals</tspan><tspan x="820" dy="31">• Lists missing information</tspan><tspan x="820" dy="31">• Explains why a flag appeared</tspan></text>
    <rect x="818" y="407" width="210" height="32" rx="16" fill="#ffebc2"/>
    <text x="923" y="429" text-anchor="middle" font="700 15px Arial" fill="#81550d">No diagnosis or treatment</text>
  </g>

  <g class="card">
    <rect x="1110" y="190" width="235" height="270" rx="22" fill="#f0edff" stroke="#aaa0e8"/>
    <circle cx="1150" cy="235" r="22" fill="#6656b8"/><text x="1150" y="243" text-anchor="middle" font="700 20px Arial" fill="white">4</text>
    <text x="1185" y="243" class="head">Human review</text>
    <text x="1140" y="291" class="body"><tspan x="1140" dy="0">• Nurse / doctor checks</tspan><tspan x="1157" dy="24">source answers and reports</tspan><tspan x="1140" dy="31">• Verifies or overrides flags</tspan><tspan x="1140" dy="31">• Requests follow-up</tspan><tspan x="1140" dy="31">• Prepares referral if needed</tspan></text>
    <text x="1140" y="430" class="small">Reviewer portal / mobile app</text>
  </g>

  <path d="M350 325 H397" class="line"/><path d="M735 325 H782" class="line"/><path d="M1055 325 H1102" class="line"/>

  <!-- urgent escalation -->
  <path d="M922 460 V550 H1226 V468" class="redline"/>
  <rect x="854" y="535" width="486" height="83" rx="18" fill="#fff0ef" stroke="#d77a73" stroke-width="2"/>
  <text x="1097" y="570" text-anchor="middle" font="700 20px Arial" fill="#a6322e">Urgency signal → prompt human review</text>
  <text x="1097" y="596" text-anchor="middle" class="small">The system does not make the care decision</text>

  <!-- decision boundary -->
  <rect x="65" y="690" width="1270" height="195" rx="24" fill="#ffffff" stroke="#c9d3e0" stroke-width="2" filter="url(#shadow)"/>
  <text x="100" y="738" class="head">Clinical decision and handoff</text>
  <rect x="100" y="765" width="490" height="78" rx="16" fill="#f0edff" stroke="#aaa0e8" stroke-width="2"/>
  <text x="345" y="797" text-anchor="middle" font="700 19px Arial" fill="#352b75">Qualified healthcare professional</text>
  <text x="345" y="824" text-anchor="middle" class="small">Makes all clinical decisions</text>
  <path d="M590 804 H735" class="line"/>
  <rect x="745" y="765" width="540" height="78" rx="16" fill="#edf8f3" stroke="#84c6a6" stroke-width="2"/>
  <text x="1015" y="797" text-anchor="middle" font="700 19px Arial" fill="#176441">Follow-up / referral / next care step</text>
  <text x="1015" y="824" text-anchor="middle" class="small">Recorded with role-based access and an audit trail</text>

  <text x="700" y="944" text-anchor="middle" font="700 18px Arial" fill="#a6322e">Triage-Bot supports faster review; it never replaces a clinician.</text>
</svg>
